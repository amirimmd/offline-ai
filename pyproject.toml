[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-ai"
version = "0.2.0"
description = "Production-grade fully offline AI system with persistent memory, hybrid retrieval, and grounded citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Offline AI Contributors" }]
keywords = ["offline", "llm", "rag", "memory", "faiss", "sqlite"]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "orjson>=3.10",
  "python-dateutil>=2.9",
  "filelock>=3.14",
  "python-bidi>=0.4.2",
  "arabic-reshaper>=3.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
embeddings = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "transformers>=4.40",
]
llm = [
  "llama-cpp-python>=0.2.80",
  "torch>=2.2",
  "transformers>=4.40",
  "accelerate>=0.30",
]
training = [
  "peft>=0.11",
  "datasets>=2.19",
  "torch>=2.2",
  "transformers>=4.40",
  "accelerate>=0.30",
  "tqdm>=4.66",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-python-dateutil>=2.9",
  "offline-ai[api]",
]
all = [
  "offline-ai[api,embeddings,llm,training,dev]",
]

[project.scripts]
offline-ai = "offline_ai.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["offline_ai*"]

[tool.setuptools.package-data]
offline_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
